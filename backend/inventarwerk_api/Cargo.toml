[package]
name = "inventarwerk_api"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.1", features = ["json", "secrets"] }
dotenvy = "0.15.7"
serde = {version="1.0.216", features=["derive"]}
reqwest = {version="0.13.1", features=["json", "form"]}
openssl = { version = "0.10", features = ["vendored"] }
lazy_static = "1.4"
rocket_cors = "0.6.0"
chrono = { version="0.4.39", features=["serde"]}
repos = {path = "../repositories"}
utils = {path = "../utils"}
# pg_dump is started as child process for the database backup
tokio = { version = "1", features = ["process", "io-util", "rt"] }
utoipa = {version="5.3.1"}
utoipa-swagger-ui = {version="9", features = ["rocket"]}

[features]
dev = []
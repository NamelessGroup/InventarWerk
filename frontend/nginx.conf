# Serves the frontend and routes API requests to the backend services by path.
# The frontend sends every request to its own origin, so all services must share it
# (this is also needed for the session cookies, which all services decrypt with SECRET_KEY).
#
# Upstream hostnames are the docker compose service names.
# They are set through a variable so nginx resolves them per request and still
# starts when a backend container is down.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # ---------- SPA pages (exact matches win over the API prefixes below) ----------
    location = /            { try_files /index.html =404; }
    location = /inventory/  { try_files /index.html =404; }
    location = /zauberwerk/ { try_files /index.html =404; }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- inventarwerk_api ----------
    location ^~ /account    { set $upstream inventarwerk-api; proxy_pass http://$upstream:8000; }
    location ^~ /inventory  { set $upstream inventarwerk-api; proxy_pass http://$upstream:8000; }
    location ^~ /itemPreset { set $upstream inventarwerk-api; proxy_pass http://$upstream:8000; }
    location ^~ /backup {
        set $upstream inventarwerk-api;
        proxy_pass http://$upstream:8000;
        # The database dump is streamed
        proxy_buffering off;
        proxy_read_timeout 10m;
    }

    # ---------- zauberwerk_api (/spellList, /spellSlot, /spellPreset, /spellAttackModifier) ----------
    location ^~ /spell         { set $upstream zauberwerk-api; proxy_pass http://$upstream:8000; }
    location ^~ /concentration { set $upstream zauberwerk-api; proxy_pass http://$upstream:8000; }
    location ^~ /spellPreset/cast/stream {
        # Server-sent events
        set $upstream zauberwerk-api;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # ---------- last_changes_api ----------
    location ^~ /lastChanges {
        # Server-sent events
        set $upstream last-changes-api;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # ---------- Swagger UI ----------
    # The combined UI is served by inventarwerk_api, each service serves its own API docs.
    location ^~ /swagger-ui                            { set $upstream inventarwerk-api; proxy_pass http://$upstream:8000; }
    location ^~ /api-docs/                             { set $upstream inventarwerk-api; proxy_pass http://$upstream:8000; }
    location ^~ /api-docs/openapi_spell                { set $upstream zauberwerk-api;   proxy_pass http://$upstream:8000; }
    location =  /api-docs/openapi_concentration.json   { set $upstream zauberwerk-api;   proxy_pass http://$upstream:8000; }
    location =  /api-docs/openapi_last_changes.json    { set $upstream last-changes-api; proxy_pass http://$upstream:8000; }

    # ---------- everything else: static files, SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

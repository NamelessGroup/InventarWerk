name: Build & Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  DATABASE_URL: postgres://inventarwerk:inventarwerk@localhost:5432/inventarwerk

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Same major version as production. All migrations are applied to this database
      # and every sqlx query is type-checked against it.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: inventarwerk
          POSTGRES_PASSWORD: inventarwerk
          POSTGRES_DB: inventarwerk
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U inventarwerk"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    permissions:
      contents: read
      packages: write
    outputs:
      metadata: ${{ steps.bake.outputs.metadata }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ---------- type-check all sqlx queries against Postgres ----------
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version ^0.8 --no-default-features --features rustls,postgres --locked

      - name: Apply migrations
        working-directory: backend
        run: sqlx migrate run --source repositories/migrations

      # Compiles the workspace against the database: fails on any query/type mismatch.
      # The generated .sqlx query data is used by the Docker build (SQLX_OFFLINE).
      - name: Check queries and prepare offline data
        working-directory: backend
        run: cargo sqlx prepare --workspace

      # ---------- build images ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata inventarwerk-api
        id: meta-inventarwerk-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/inventarwerk-api
          bake-target: meta-inventarwerk-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Metadata zauberwerk-api
        id: meta-zauberwerk-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/zauberwerk-api
          bake-target: meta-zauberwerk-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Metadata last-changes-api
        id: meta-last-changes-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/last-changes-api
          bake-target: meta-last-changes-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Metadata web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/web
          bake-target: meta-web
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Short commit hash
        id: version
        env:
          # On pull_request events GITHUB_SHA is GitHub's temporary merge commit
          # (refs/pull/N/merge), which is not reachable from any branch. Use the PR head instead.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::6}" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        id: bake
        uses: docker/bake-action@v6
        env:
          VERSION: ${{ steps.version.outputs.short }}
        with:
          # Local context, so the freshly generated backend/.sqlx is part of the build
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta-inventarwerk-api.outputs.bake-file-tags }}
            ${{ steps.meta-inventarwerk-api.outputs.bake-file-labels }}
            ${{ steps.meta-zauberwerk-api.outputs.bake-file-tags }}
            ${{ steps.meta-zauberwerk-api.outputs.bake-file-labels }}
            ${{ steps.meta-last-changes-api.outputs.bake-file-tags }}
            ${{ steps.meta-last-changes-api.outputs.bake-file-labels }}
            ${{ steps.meta-web.outputs.bake-file-tags }}
            ${{ steps.meta-web.outputs.bake-file-labels }}
          push: true
          # The three backend images share the builder stage, so one cache covers all of them
          set: |
            inventarwerk-api.cache-from=type=gha,scope=backend
            inventarwerk-api.cache-to=type=gha,scope=backend,mode=max
            zauberwerk-api.cache-from=type=gha,scope=backend
            last-changes-api.cache-from=type=gha,scope=backend
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max

  attest:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [inventarwerk-api, zauberwerk-api, last-changes-api, web]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: name
        run: echo "image=${IMAGE_PREFIX,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ fromJSON(needs.build.outputs.metadata)[matrix.image]['containerimage.digest'] }}
          push-to-registry: true
